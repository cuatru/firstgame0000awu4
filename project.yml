name: FlowWatch
options:
  bundleIdPrefix: com.flowwatch
  deploymentTarget:
    watchOS: "11.0"

targets:
  FlowWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Sources/FlowWatch
    settings:
      base:
        PRODUCT_NAME: FlowWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.flowwatch.FlowWatch
        INFOPLIST_FILE: Sources/FlowWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

  FlowWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Tests/FlowWatchTests
    dependencies:
      - target: FlowWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowwatch.FlowWatchTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

schemes:
  FlowWatch:
    build:
      targets:
        FlowWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FlowWatchTests
    archive:
      config: Release
